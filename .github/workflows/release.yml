name: Verify and publish keyboard installer
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path setup.iss -Pattern '^#define Version "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and installer version must match' }
      - name: Build installer
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'MSKLC.exe'
          $extracted = Join-Path $env:RUNNER_TEMP 'keyboard-tools'
          $toolkit = Join-Path $env:RUNNER_TEMP 'msklc-toolkit'
          Invoke-WebRequest 'https://download.microsoft.com/download/6/f/5/6f5ce43a-e892-4fd1-b9a6-1a0cbb64e6e2/MSKLC.exe' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'CD12A6B08066133DC4AD71BDCACCF1492E3D9A1DE93CF84B7B2824309F0D7255') {
            throw 'Unexpected Microsoft toolkit checksum'
          }
          7z x $archive "-o$extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Toolkit extraction failed' }
          $msi = Join-Path $extracted 'MSKLC\MSKLC.msi'
          $process = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$toolkit`"" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed ($($process.ExitCode))" }
          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          .\build.ps1 -Toolkit $toolkit -InnoCompiler $inno
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify x64 layout
        run: python -B -O verify.py --layout build/amd64/ualtgr.dll
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x86
      - name: Verify WOW64 layout
        run: python -B -O verify.py --layout build/wow64/ualtgr.dll
      - name: Check packaged DLLs
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ualtgr-setup.log'
          $installer = Join-Path $PWD 'dist\Ukrainian-AltGr-x64.exe'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Installer test failed ($($process.ExitCode))"
          }
          foreach ($target in @{amd64 = 'System32'; wow64 = 'SysWOW64'}.GetEnumerator()) {
            $built = Get-FileHash -LiteralPath "build\$($target.Key)\ualtgr.dll"
            $installed = Get-FileHash -LiteralPath "$env:windir\$($target.Value)\ualtgr.dll"
            if ($built.Hash -ne $installed.Hash) { throw "Packaged DLL differs for $($target.Key)" }
          }
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: Ukrainian-AltGr-x64
          path: dist/Ukrainian-AltGr-x64.exe
          if-no-files-found: error
          overwrite: true

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Ukrainian-AltGr-x64
      - name: Publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Ukrainian-AltGr-x64.exe --verify-tag --title "Ukrainian AltGr $GITHUB_REF_NAME" --generate-notes
